[package]
name = "nice-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events", "windows"] }
futures-util = "0.3.34"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
qrcode = { version = "0.14.1", default-features = false }
regex = "1.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt-multi-thread", "time"] }
unicode-width = "0.2.3"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
